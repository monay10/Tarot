<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0b0716">
  <title>Mistik Tarot</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Ambient glow background -->
  <div class="ambient-glow-container" aria-hidden="true">
    <div class="glow-blob blob-violet"></div>
    <div class="glow-blob blob-gold"></div>
    <div class="glow-blob blob-teal"></div>
    <div class="glow-blob blob-magenta"></div>
  </div>

  <!-- Language toggle -->
  <button id="lang-toggle" class="lang-toggle" aria-label="Change language">EN</button>

  <!-- Sound & vibration toggle -->
  <button id="sound-toggle" class="lang-toggle sound-toggle" aria-label="Sound &amp; vibration">🔊</button>

  <!-- ═══════════ INTRO ═══════════ -->
  <section id="intro-screen" class="screen active">
    <div class="intro-ornament">✦ &nbsp; ✧ &nbsp; ✦</div>
    <h1 class="site-title" data-i18n="title">Mistik Tarot</h1>
    <p class="tagline" data-i18n="tagline"></p>
    <button id="start-btn" class="btn-primary" data-i18n="start"></button>
    <div id="streak-badge" class="streak-badge hidden">🔥 <span id="streak-text"></span></div>
    <p class="disclaimer" data-i18n="disclaimer"></p>
  </section>

  <!-- ═══════════ SPREAD MENU ═══════════ -->
  <section id="menu-screen" class="screen">
    <h2 class="screen-title" data-i18n="chooseSpread"></h2>
    <div class="spread-cards">
      <button class="spread-card" data-spread="daily">
        <svg class="spread-icon" viewBox="0 0 80 60" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="28" y="6" width="24" height="40" rx="4"/>
          <path d="M40 18 L42.5 24 L48 26 L42.5 28 L40 34 L37.5 28 L32 26 L37.5 24 Z"/>
        </svg>
        <h3 data-i18n="dailyTitle"></h3>
        <p data-i18n="dailyDesc"></p>
      </button>
      <button class="spread-card" data-spread="three">
        <svg class="spread-icon" viewBox="0 0 80 60" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="6" y="12" width="18" height="32" rx="3" transform="rotate(-8 15 28)"/>
          <rect x="31" y="8" width="18" height="32" rx="3"/>
          <rect x="56" y="12" width="18" height="32" rx="3" transform="rotate(8 65 28)"/>
        </svg>
        <h3 data-i18n="threeTitle"></h3>
        <p data-i18n="threeDesc"></p>
      </button>
      <button class="spread-card" data-spread="yesno">
        <svg class="spread-icon" viewBox="0 0 80 60" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="12" y="10" width="22" height="36" rx="3" transform="rotate(-6 23 28)"/>
          <path d="M17 28 L21 32 L29 22"/>
          <rect x="46" y="10" width="22" height="36" rx="3" transform="rotate(6 57 28)"/>
          <path d="M52 23 L62 33 M62 23 L52 33"/>
        </svg>
        <h3 data-i18n="yesnoTitle"></h3>
        <p data-i18n="yesnoDesc"></p>
      </button>
      <button class="spread-card" data-spread="love">
        <svg class="spread-icon" viewBox="0 0 80 60" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="28" y="6" width="24" height="40" rx="4"/>
          <path d="M40 37 C32 30 29 24 32.5 20 C35.5 17 40 19.5 40 23.5 C40 19.5 44.5 17 47.5 20 C51 24 48 30 40 37 Z"/>
        </svg>
        <h3 data-i18n="loveTitle"></h3>
        <p data-i18n="loveDesc"></p>
      </button>
    </div>
    <button id="journal-btn" class="btn-ghost journal-btn">📖 <span data-i18n="journal"></span></button>
  </section>

  <!-- ═══════════ JOURNAL ═══════════ -->
  <section id="journal-screen" class="screen">
    <header class="draw-header">
      <button id="journal-back-btn" class="btn-back" aria-label="Back">←</button>
      <p class="draw-prompt" data-i18n="journal"></p>
    </header>
    <div id="journal-stats" class="journal-stats"></div>
    <div id="journal-list" class="journal-list"></div>
    <button id="journal-clear-btn" class="btn-ghost journal-clear hidden" data-i18n="clearJournal"></button>
  </section>

  <!-- ═══════════ TABLE (draw + results) ═══════════ -->
  <section id="table-screen" class="screen">
    <header class="draw-header">
      <button id="back-btn" class="btn-back" aria-label="Back">←</button>
      <p id="draw-prompt" class="draw-prompt"></p>
    </header>

    <div id="slots" class="slots"></div>

    <div id="results" class="results"></div>

    <div id="oracle-panel" class="oracle-panel hidden">
      <h3 class="oracle-title">✨ <span data-i18n="oracleTitle"></span></h3>
      <textarea id="oracle-q" rows="2" maxlength="200"></textarea>
      <button id="oracle-btn" class="btn-primary oracle-go" data-i18n="oracleGo"></button>
      <div id="oracle-out" class="oracle-out"></div>
    </div>

    <div id="result-actions" class="result-actions hidden">
      <button id="again-btn" class="btn-primary" data-i18n="again"></button>
      <button id="share-btn" class="btn-ghost" data-i18n="share"></button>
      <button id="menu-btn" class="btn-ghost" data-i18n="backMenu"></button>
    </div>

    <div id="fan" class="fan"></div>
  </section>
